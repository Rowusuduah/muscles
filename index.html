<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>muscles</title>
<meta name="theme-color" content="#121417">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="muscles">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --iron:#121417; --panel:#1A1E22; --panel2:#22272C; --line:#2C3237; --line2:#3A424A;
  --chalk:#F1EEE6; --muted:#8B939B; --muted2:#6A727A;
  --ember:#F2551C; --ember2:#FF8348; --emberwash:rgba(242,85,28,.12); --emberline:rgba(242,85,28,.40);
  --steel:#6C97BC; --ok:#5FB07E; --musc:#242A30;
  --disp:'Oswald','Arial Narrow',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Inter','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--iron);color:var(--chalk);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* type */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);font-weight:600}
.mono{font-family:var(--mono)}
.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.01em}
h1.day{font-family:var(--disp);font-weight:700;font-size:clamp(40px,12vw,54px);line-height:.92;margin:6px 0 6px;text-transform:uppercase}
.sub{font-size:14px;color:var(--muted);margin:0 0 16px}
.sub b{color:var(--chalk);font-weight:600}

/* topbar */
header{padding:calc(20px + env(safe-area-inset-top)) 0 6px}
.topbar{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:.03em}
.brand .dot{width:9px;height:9px;border-radius:2px;background:var(--ember);box-shadow:0 0 12px var(--ember)}
.date{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.rankrow{display:flex;align-items:center;gap:12px;margin:16px 0 4px}
.rank{flex:1}
.rank .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.rank .barwrap{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.rank .bar{height:100%;background:linear-gradient(90deg,var(--ember),var(--ember2));border-radius:3px;transition:width .5s}
.streak{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:600;
  background:var(--panel);border:1px solid var(--line);padding:7px 11px;border-radius:999px}
.flame{width:13px;height:13px}

/* panels / cards */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 0 12px}
.card.active{border-color:var(--emberline);box-shadow:0 0 0 1px var(--emberline),0 14px 30px rgba(0,0,0,.3)}

/* big CTA */
.cta{display:block;width:100%;border:0;border-radius:16px;background:var(--ember);color:#fff;
  font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:22px;
  padding:20px;box-shadow:0 12px 30px rgba(242,85,28,.28)}
.cta.sub{background:var(--panel);color:var(--chalk);border:1px solid var(--line);box-shadow:none;font-size:15px;padding:13px}
.cta:active{transform:translateY(1px)}

/* figure panel */
.figpanel{display:flex;gap:14px;align-items:center}
.figpanel .figwrap{width:88px;flex:0 0 auto}
.figure{width:88px;height:auto;display:block}
.tinfo .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:6px;background:var(--emberwash);
  color:var(--ember);border:1px solid var(--emberline);font-weight:500}
.chip.cool{background:transparent;color:var(--muted);border-color:var(--line)}
.chip.tap{cursor:pointer}

/* meter */
.meter{display:flex;align-items:center;gap:10px;margin:14px 2px 16px}
.pips{display:flex;gap:4px;flex:1}
.pip{height:5px;flex:1;border-radius:3px;background:var(--line)}
.pip.on{background:var(--ember)}
.meter .n{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* time chips */
.timegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.timechip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 10px;text-align:center}
.timechip .big{font-family:var(--disp);font-size:30px;font-weight:600;color:var(--chalk)}
.timechip .u{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.timechip.sel{border-color:var(--ember);background:var(--emberwash)}
.timechip.sel .big{color:var(--ember)}

/* exercise slot card */
.slot .chead{display:flex;gap:13px;padding:14px 14px 10px}
.shot{width:66px;height:66px;border-radius:12px;flex:0 0 auto;object-fit:cover;background:var(--panel2);border:1px solid var(--line)}
.shot.ph{display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--muted2);text-align:center;line-height:1.3}
.cnum{font-family:var(--mono);font-size:10px;color:var(--ember);letter-spacing:.12em;font-weight:600}
.cname{font-family:var(--disp);font-weight:600;font-size:21px;line-height:1;margin:3px 0 5px;text-transform:uppercase}
.ctag{font-family:var(--mono);font-size:10px;color:var(--muted)}
.target{display:flex;align-items:center;gap:8px;padding:2px 14px 12px}
.target .t{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--chalk)}
.target .note{font-size:11.5px;color:var(--steel);margin-left:auto;text-align:right;max-width:52%}
.plates{display:flex;gap:3px;align-items:flex-end;height:22px;margin-left:auto}
.plate{width:7px;border-radius:2px;background:var(--steel)}

.picker{padding:0 14px 12px}
.picker .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:4px 0 8px}
.machopts{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.macho{flex:0 0 auto;width:112px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.macho img{width:100%;height:74px;object-fit:cover;display:block}
.macho .nm{font-size:11px;padding:6px 7px;line-height:1.2}
.macho.sel{border-color:var(--ember)}
.macho.sel .nm{color:var(--ember)}

.sets{border-top:1px solid var(--line)}
.setrow{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.slab{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;width:42px}
.setrow input{width:56px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--chalk);
  font-family:var(--mono);font-size:14px;padding:8px;text-align:center;-moz-appearance:textfield}
.setrow input::-webkit-outer-spin-button,.setrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.setrow .x{font-family:var(--mono);font-size:11px;color:var(--muted2)}
.setrow .tick{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;background:transparent}
.setrow .tick.done{background:var(--ok);border-color:var(--ok)}
.setrow .tick svg{width:14px;height:14px;stroke:var(--iron);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.setrow .tick.done svg{opacity:1}

.cfoot{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.rest{font-family:var(--mono);font-size:11px;color:var(--steel);border:1px solid var(--line);padding:7px 10px;border-radius:8px;background:transparent}
.rest.run{color:var(--ember);border-color:var(--emberline)}
.cue{font-size:12px;color:var(--muted);flex:1;min-width:120px}
.cue b{color:var(--chalk);font-weight:600}
.mini{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:transparent;
  border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 11px}
.mini.busy{border-color:var(--emberline);color:var(--ember)}
.next-btn{margin-left:auto;font-family:var(--disp);font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  font-size:14px;background:var(--ember);color:#fff;border:0;border-radius:10px;padding:11px 18px}

/* section heads */
h2.sec{font-family:var(--disp);font-weight:600;font-size:24px;text-transform:uppercase;margin:24px 0 4px}
.lede{font-size:13.5px;color:var(--muted);margin:0 0 16px}

/* explorer */
.bodyparts{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.bp{flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 13px}
.bp.on{background:var(--ember);border-color:var(--ember);color:#fff}
.eqgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eqcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.eqcard img{width:100%;height:120px;object-fit:cover;display:block;background:var(--panel2)}
.eqcard .b{padding:10px 11px}
.eqcard .nm{font-family:var(--disp);font-weight:600;font-size:15px;text-transform:uppercase;line-height:1.1}
.eqcard .ty{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.eqcard .ex{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.35}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .v{font-family:var(--disp);font-size:26px;font-weight:600}
.stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.volrow{display:flex;align-items:center;gap:10px;margin:7px 0}
.volrow .nm{font-family:var(--mono);font-size:11px;width:78px;color:var(--muted);text-transform:capitalize}
.volbar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.volbar i{display:block;height:100%;border-radius:4px}
.volrow .c{font-family:var(--mono);font-size:10.5px;color:var(--muted2);width:44px;text-align:right}

/* plan */
.weekrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel)}
.weekrow.now{border-color:var(--ember);box-shadow:0 0 0 1px var(--emberline)}
.weekrow .idx{font-family:var(--mono);font-size:10px;color:var(--muted);width:20px}
.weekrow .nm{font-family:var(--disp);font-weight:600;font-size:18px;text-transform:uppercase}
.weekrow .mus{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto;text-align:right;max-width:50%}
.weekrow.cardio .nm{color:var(--steel)}

/* coach */
.rule{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.rule b{font-family:var(--disp);font-weight:600;font-size:16px;text-transform:uppercase;display:block;margin-bottom:3px}
.rule p{font-size:13px;color:var(--muted);margin:0}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(18,20,23,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{background:transparent;border:0;padding:7px 2px 5px;border-radius:9px;
  font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted2);display:flex;flex-direction:column;align-items:center;gap:5px}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--chalk)}
nav.tabs button.on svg{stroke:var(--ember)}

/* toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--panel2);border:1px solid var(--emberline);color:var(--chalk);font-size:13px;
  padding:12px 18px;border-radius:12px;z-index:40;transition:.3s;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <div class="brand"><span class="dot"></span>muscles</div>
      <div class="date" id="date">—</div>
    </div>
    <div class="rankrow">
      <div class="rank"><div class="lab" id="ranklab">Rank</div><div class="barwrap"><div class="bar" id="rankbar" style="width:0"></div></div></div>
      <div class="streak">
        <svg class="flame" viewBox="0 0 24 24" fill="var(--ember)" stroke="none"><path d="M12 2c1 4 5 5 5 9a5 5 0 0 1-10 0c0-1 .3-2 1-3 .2 2 1.5 2.5 1.5 2.5C8 8 12 6 12 2z"/></svg>
        <span id="streak">0</span>
      </div>
    </div>
  </header>

  <main id="screens">
    <section id="s-today" class="screen"></section>
    <section id="s-train" class="screen hidden"></section>
    <section id="s-progress" class="screen hidden"></section>
    <section id="s-plan" class="screen hidden"></section>
    <section id="s-coach" class="screen hidden"></section>
  </main>
</div>

<nav class="tabs"><div class="inner">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Today</button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M6 21c0-4 2.5-7 6-7s6 3 6 7"/></svg>Train</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>Progress</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Plan</button>
  <button data-tab="coach"><svg viewBox="0 0 24 24"><path d="M12 3l8 4-8 4-8-4 8-4zM4 12l8 4 8-4M4 17l8 4 8-4"/></svg>Coach</button>
</div></nav>

<div class="toast" id="toast"></div>

<script src="data/muscles.js"></script>
<script src="data/exercises.js"></script>
<script src="data/equipment.js"></script>
<script src="data/program.js"></script>
<script src="figure.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
